name: Manual Test → Playwright Pipeline

# Pipeline shape (docs/pipeline-plan.md Section 7):
#   push to manual-tests/**.md
#     -> [dedup]           compute which files actually changed (content hash, not just git diff,
#                           so a revert-and-reapply doesn't waste a dispatch)
#     -> [generate-and-run] one job per new/changed file, matrix, max-parallel 1, invokes
#                           `copilot -p ...` headlessly; test execution inside that session goes
#                           ONLY through scripts/bounded-run.js (Layer A+B, see Section 4). This
#                           job commits and pushes its own output directly to a shared per-run
#                           branch (manual-test-pipeline/<run_id>) — each matrix job's changes must
#                           persist before that job's disposable runner is torn down, since nothing
#                           carries over to another job's VM automatically. The agent itself is
#                           denied all git write access; only the workflow commits.
#     -> [finalize]         opens the PR against manual-test-pipeline/<run_id> once, after all
#                           matrix jobs have had a chance to push to it. Hard-stopped runs get a
#                           draft PR labeled needs-human with the CSV/report/transcript artifacts
#                           available for review.
#     -> the EXISTING .github/workflows/playwright.yml still runs independently on the resulting
#        PR and is the real pass/fail gate — this workflow's job output is never trusted as final.

on:
  push:
    branches: [main, master]
    paths:
      - 'manual-tests/**.md'
  workflow_dispatch:
    inputs:
      max_files:
        description: >
          Max manual-tests files to dispatch in this run. Copilot CLI now bills
          against a per-account AI-credit allowance rather than a simple
          request counter (see docs/ci-setup.md, "Free-tier budget"), and a
          single agentic generate+heal session can consume a large share of a
          Free-tier allowance. Default is deliberately conservative (1) —
          raise it only after confirming actual per-file credit cost against
          your account's real allowance at github.com/settings/billing.
        required: false
        default: '1'

permissions:
  contents: write
  pull-requests: write

jobs:
  dedup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      has_changes: ${{ steps.compute.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Compute changed manual-tests files (content hash vs. committed manifest)
        id: compute
        env:
          MAX_FILES: ${{ github.event.inputs.max_files || '1' }}
        run: |
          CHANGED=$(node scripts/compute-manual-test-hashes.js check)
          echo "Changed files: $CHANGED"

          TOTAL_CHANGED=$(echo "$CHANGED" | node -e "
            let d='';process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{console.log(JSON.parse(d).length)});
          ")

          # Cap the batch. This is a deliberate safety guard, not a
          # convenience feature: on a Free-tier / low-allowance Copilot
          # account, dispatching every changed file in one push could exhaust
          # a month's AI-credit allowance (or trigger billed overage if no
          # spending limit is set) in a single CI run. See docs/ci-setup.md.
          CHANGED=$(echo "$CHANGED" | node -e "
            let d='';process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              const files = JSON.parse(d).slice(0, ${MAX_FILES});
              console.log(JSON.stringify(files));
            });
          ")

          if [ "$TOTAL_CHANGED" -gt "$MAX_FILES" ]; then
            echo "::warning::${TOTAL_CHANGED} manual-tests files changed, but max_files=${MAX_FILES} — only dispatching the first ${MAX_FILES}. Remaining files stay flagged as changed (manifest untouched for them) and will be picked up on the next run. Re-run with a higher max_files input once you've confirmed real per-file credit cost."
          fi

          COUNT=$(echo "$CHANGED" | node -e "
            let d='';process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{const arr=JSON.parse(d);console.log(arr.length)});
          ")
          if [ "$COUNT" = "0" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          MATRIX_JSON=$(echo "$CHANGED" | node -e "
            let d='';process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              const files=JSON.parse(d);
              console.log(JSON.stringify({ file: files }));
            });
          ")
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  generate-and-run:
    needs: dedup
    if: needs.dedup.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Cap fan-out deliberately: each `copilot -p` call is a metered,
      # usage-based Copilot session (AI credits, not a simple request count —
      # see docs/ci-setup.md "Free-tier budget"). A single agentic
      # generate+heal session can consume a large share of a low-allowance
      # account's monthly credits. Combined with the max_files cap on the
      # dedup job, max-parallel: 1 means you see exactly one file's real
      # credit cost before ever running two at once. Raise both once you've
      # confirmed actual cost against your account's allowance at
      # github.com/settings/billing.
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJson(needs.dedup.outputs.matrix) }}
    outputs: {}
    env:
      COPILOT_OTEL_ENABLED: 'true'
      COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ github.workspace }}/otel-trace-${{ strategy.job-index }}.jsonl
      # App-under-test config. playwright.config.ts loads these via dotenv
      # from a local .env file for local runs, but no .env file exists in CI
      # — these come from repo Variables (not Secrets — confirmed in this
      # repo's Settings → Secrets and variables → Actions → Variables tab), or
      # every generated test fails on a missing baseURL/credential, which
      # looks like a real bug but isn't. See docs/ci-setup.md.
      BASE_URL: ${{ vars.BASE_URL }}
      APP_URL: ${{ vars.APP_URL }}
      EMAIL_ADDRESS: ${{ vars.EMAIL_ADDRESS }}
      PASSWORD: ${{ vars.PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout or continue this run's working branch
        run: |
          # CRITICAL: each matrix job runs on its own disposable VM. Without
          # this step (and the push step later in this job), any files the
          # agent writes only exist on that VM and are gone the moment the
          # job ends — the separate `finalize` job runs on a DIFFERENT VM
          # with its own fresh checkout and would never see them. This step
          # + the "Commit and push" step below are what make generated code
          # actually persist. See docs/pipeline-plan.md and the incident this
          # fixed: the original version of this workflow ran real generate
          # jobs successfully but silently discarded all output.
          git config user.name "manual-test-pipeline-bot"
          git config user.email "actions@github.com"
          BRANCH="manual-test-pipeline/${{ github.run_id }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Pre-flight — confirm skill/agent are discoverable
        run: copilot plugins list --json || echo "::warning::copilot plugins list failed or copilot CLI not installed on this runner — see docs/pipeline-plan.md Section 9 item 4 for auth/setup prerequisites."

      - name: Record pre-run CSV row count
        id: pre_csv
        run: |
          if [ -f unresolved-test-failures.csv ]; then
            echo "count=$(wc -l < unresolved-test-failures.csv)" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
          fi

      # NOTE: `copilot` CLI auth is expected via COPILOT_GITHUB_TOKEN / GH_TOKEN
      # / GITHUB_TOKEN precedence (docs/pipeline-plan.md Section 3 and Section 9
      # item 2). Wire the actual secret name used by your org below.
      #
      # NOTE on --max-ai-credits=40: GitHub moved Copilot billing from a flat
      # request counter to usage-based AI Credits on 2026-06-01. This "40" was
      # never validated against real post-change costs — a single agentic
      # session on a capable model can run into the hundreds of credits. On a
      # Free-tier account this cap may be close to (or exceed) your entire
      # allowance for a session, or may be too small to let one full 3-attempt
      # heal cycle finish. Run one file, check actual credit spend at
      # github.com/settings/billing, then tune this number — don't trust it
      # as-is. See docs/ci-setup.md, "Free-tier budget".
      - name: Generate, execute, and bounded-heal via Copilot CLI
        id: copilot_run
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set +e
          copilot -p "Generate, execute, and bounded-heal a Playwright test for ${{ matrix.file }}. Follow .github/copilot-instructions.md, AGENTS.md, and the pom-conventions + playwright-cli skills exactly. Run tests ONLY via node scripts/bounded-run.js <spec> — never call npx playwright test or npm test directly. Do not run any git commands — the CI workflow commits and pushes your changes after you finish; you only need to write/edit files on disk." \
            --agent playwright-test-generator \
            --allow-tool 'shell(node scripts/bounded-run.js:*)' \
            --deny-tool 'shell(git add:*)' \
            --deny-tool 'shell(git commit:*)' \
            --deny-tool 'shell(git push:*)' \
            --deny-tool 'shell(npx playwright test:*)' \
            --deny-tool 'shell(npm test:*)' \
            --deny-tool 'read(.env)' \
            --deny-tool 'read(.auth/*)' \
            --no-ask-user \
            --model claude-sonnet-4.6 \
            --max-ai-credits=40 \
            --output-format json -s \
            > "copilot-output-${{ strategy.job-index }}.jsonl"
          COPILOT_EXIT=$?
          echo "copilot_exit=$COPILOT_EXIT" >> "$GITHUB_OUTPUT"
          exit 0  # never fail this step directly — the next step interprets the real state

      - name: Determine hard-stop vs. success
        id: outcome
        run: |
          # bounded-run.js writes deterministically to unresolved-test-failures.csv
          # ONLY on hard stop (script does this, not the agent — see Section 4). A
          # row-count increase during this job is a more reliable signal than
          # guessing the generated spec's filename from the manual-tests source
          # path, since the agent chooses (or appends to) the spec file itself.
          if [ -f unresolved-test-failures.csv ]; then
            POST_COUNT=$(wc -l < unresolved-test-failures.csv)
          else
            POST_COUNT=0
          fi
          if [ "$POST_COUNT" -gt "${{ steps.pre_csv.outputs.count }}" ]; then
            echo "result=hard-stop" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.copilot_run.outputs.copilot_exit }}" = "0" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=incomplete" >> "$GITHUB_OUTPUT"
          fi

      - name: Update hash manifest on success
        # Must run BEFORE the commit+push step below — otherwise this file
        # change would be made on disk but never actually committed/pushed.
        if: steps.outcome.outputs.result == 'success'
        run: node scripts/compute-manual-test-hashes.js update "${{ matrix.file }}"

      - name: Commit and push generated changes
        # Runs regardless of outcome — a hard-stopped file may still have
        # produced a partial Page Object or an updated CSV row worth keeping
        # for human review. This step (not the agent) owns every commit;
        # see the checkout step above for why this is required at all.
        if: always()
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No file changes for ${{ matrix.file }} — nothing to commit (agent may have hard-stopped before writing anything, or produced no diff)."
            exit 0
          fi
          git add -A
          git commit -m "Generate/heal Playwright test for ${{ matrix.file }} (run ${{ github.run_id }}, outcome: ${{ steps.outcome.outputs.result }})"
          git push origin "manual-test-pipeline/${{ github.run_id }}"

      - name: Upload raw Copilot CLI session transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-output-${{ strategy.job-index }}
          path: copilot-output-*.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright report/trace on non-success
        if: steps.outcome.outputs.result != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload OTel trace for cost observability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otel-trace-${{ strategy.job-index }}
          path: otel-trace-*.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail the job on hard-stop (dead-lettered, needs human review)
        if: steps.outcome.outputs.result == 'hard-stop'
        run: |
          echo "::error::${{ matrix.file }} hit the 3-attempt heal cap. Row already written to unresolved-test-failures.csv by scripts/bounded-run.js. See uploaded playwright-report artifact and the CSV in the commit made by the finalize job."
          exit 1

  finalize:
    needs: [dedup, generate-and-run]
    if: always() && needs.dedup.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open PR for this run's branch, if it has any commits
        # generate-and-run now commits+pushes its own work directly (see the
        # "Checkout or continue this run's working branch" and "Commit and
        # push generated changes" steps in that job) — this job's only
        # remaining responsibility is opening the PR once, after all matrix
        # jobs have had a chance to push to the shared run branch.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="manual-test-pipeline/${{ github.run_id }}"

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH was never pushed — no generate-and-run job committed anything (e.g. every matrix job hard-stopped before writing any file, or produced no diff). Nothing to open a PR for."
            exit 0
          fi

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for $BRANCH — nothing further to do."
            exit 0
          fi

          if [ "${{ needs.generate-and-run.result }}" = "success" ]; then
            gh pr create --title "Generated Playwright tests (run ${{ github.run_id }})" \
              --body "Automated output of the manual-test-to-Playwright pipeline. See docs/pipeline-plan.md for design. The existing playwright.yml suite is the real validation gate for this PR." \
              --base main --head "$BRANCH"
          else
            gh pr create --title "[WIP] Generated Playwright tests — needs human review (run ${{ github.run_id }})" \
              --body "One or more manual-tests files hit the 3-attempt heal cap, or the generate-and-run job otherwise failed. See unresolved-test-failures.csv on this branch, and the copilot-output/playwright-report/otel-trace artifacts uploaded on the generate-and-run job, for diagnostics." \
              --base main --head "$BRANCH" --draft --label needs-human
          fi
